spring.application.name=backend

# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Local development by default; production sets SPRING_PROFILES_ACTIVE=prod
spring.profiles.default=dev

# Only the health endpoint is exposed (used by the hosting platform health check)
management.endpoints.web.exposure.include=health

# Origins allowed to call the API from a browser (comma-separated). Local Angular dev server by default.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
# Same origins for the health endpoint, read-only (the frontend shows the API status)
management.endpoints.web.cors.allowed-origins=${app.cors.allowed-origins}
management.endpoints.web.cors.allowed-methods=GET

# Access tokens (JWT, HS256). The signing secret is set per profile; prod reads it from JWT_SECRET.
app.security.jwt.issuer=invoiceflow
app.security.jwt.access-token-ttl=15m

# Refresh tokens: opaque, rotated on every use, stored hashed. A session ends after 7 days without activity.
app.security.refresh-token.ttl=7d
