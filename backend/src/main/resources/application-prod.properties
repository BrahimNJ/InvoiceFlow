# Production: every value comes from the environment, no default, so a missing secret fails fast at startup.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hosting platforms inject the HTTP port to listen on
server.port=${PORT:8080}

# Vercel production frontend; not a secret, so a default is fine. Override with CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://invoice-flow-seven-omega.vercel.app}
