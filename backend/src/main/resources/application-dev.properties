# Local PostgreSQL started with `docker compose up -d` (see compose.yaml).
# Defaults match compose.yaml; override them with environment variables if needed.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/invoiceflow}
spring.datasource.username=${DB_USERNAME:invoiceflow}
spring.datasource.password=${DB_PASSWORD:invoiceflow}

# Dev-only signing key. Prod has no default and fails at startup without JWT_SECRET.
app.security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long}

# Plain HTTP on localhost
app.security.refresh-cookie.secure=false
