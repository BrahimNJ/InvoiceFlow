# In-memory H2 in PostgreSQL mode; Flyway applies the same migrations as production
spring.datasource.url=jdbc:h2:mem:invoiceflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Test-only signing key
app.security.jwt.secret=test-only-secret-not-for-production-32-bytes

# Per-IP limit on the authentication endpoints is on by default; tests that sign in many times turn it off
app.rate-limit.auth.enabled=false
