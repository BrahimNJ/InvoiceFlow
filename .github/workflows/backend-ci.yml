name: Backend CI

on:
  push:
    branches:
      - main
      # Issue branches: <issue-number>-<type>/<short-name>
      - "[0-9]*-*/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: ./mvnw --batch-mode verify
      # JaCoCo (pom.xml) has already failed the build if coverage fell under its floor; publish the figures
      - name: Coverage summary
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          [ -f "$csv" ] || exit 0
          awk -F, 'NR > 1 { im += $4; ic += $5; bm += $6; bc += $7; lm += $8; lc += $9 }
            END {
              printf "### Backend coverage (JaCoCo)\n\n| Counter | Covered |\n|---------|---------|\n"
              printf "| Lines | %.1f %% |\n| Branches | %.1f %% |\n| Instructions | %.1f %% |\n",
                100 * lc / (lc + lm), 100 * bc / (bc + bm), 100 * ic / (ic + im)
            }' "$csv" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

      # Inputs of the README badges, published by the job below (main only)
      - name: Badge data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p badges
          passed=$(node -e '
            const { readdirSync, readFileSync } = require("node:fs");
            const dir = "target/surefire-reports";
            let passed = 0;
            for (const file of readdirSync(dir).filter((name) => /^TEST-.*\.xml$/.test(name))) {
              const suite = /<testsuite\b[^>]*>/.exec(readFileSync(`${dir}/${file}`, "utf8"))[0];
              const n = Object.fromEntries([...suite.matchAll(/ (\w+)="(\d+)"/g)].map(([, k, v]) => [k, Number(v)]));
              passed += n.tests - (n.failures ?? 0) - (n.errors ?? 0) - (n.skipped ?? 0);
            }
            console.log(passed);
          ')
          lines=$(awk -F, 'NR > 1 { lm += $8; lc += $9 } END { printf "%.2f%%", 100 * lc / (lc + lm) }' \
            target/site/jacoco/jacoco.csv)
          node ../.github/scripts/badge.mjs badges/backend-tests.json "backend tests" "$passed passed"
          node ../.github/scripts/badge.mjs badges/backend-coverage.json "backend coverage" "$lines"

      - name: Upload badge data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: badges-backend
          path: backend/badges/

  # Separate job so that the only code running with write access is the publish script, not the build
  publish-badges:
    name: Publish backend badges
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - name: Download badge data
        uses: actions/download-artifact@v4
        with:
          name: badges-backend
          path: badges

      - name: Publish to the badges branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-badges.sh badges/*.json
