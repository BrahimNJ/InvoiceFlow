name: E2E

# The real stack in one job: PostgreSQL service, the Spring Boot jar (dev profile, whose defaults match the
# service), the production frontend build pointed at it. Then Playwright with axe-core on the main journey
# and the Lighthouse budget on the public pages. See docs/testing.md.
on:
  push:
    branches:
      - main
      # Issue branches: <issue-number>-<type>/<short-name>
      - "[0-9]*-*/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  e2e:
    name: E2E, accessibility and Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: invoiceflow
          POSTGRES_USER: invoiceflow
          POSTGRES_PASSWORD: invoiceflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U invoiceflow -d invoiceflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Unit tests already run in Backend CI
      - name: Package backend
        working-directory: backend
        run: ./mvnw --batch-mode --quiet -DskipTests package

      - name: Start backend
        working-directory: backend
        run: |
          nohup java -jar target/backend-*.jar > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl --silent --fail http://localhost:8080/actuator/health > /dev/null && exit 0
            sleep 2
          done
          echo "::error::The backend did not become healthy within 2 minutes"
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend for E2E
        working-directory: frontend
        run: npm run build:e2e

      # Google Chrome is preinstalled on the runner: Playwright uses it (channel "chrome"), no browser download
      - name: Run end-to-end tests
        working-directory: frontend
        run: npx playwright test

      - name: Check the Lighthouse budget
        working-directory: frontend
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: frontend/.lighthouseci/
          # .lighthouseci is a dot folder, skipped by default
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Backend log
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log"

      # Inputs of the README badges, published by the job below (main only)
      - name: Badge data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: frontend
        run: |
          mkdir -p badges
          passed=$(node -p 'require("./playwright-results.json").stats.expected')
          scores=$(node -p '
            const runs = require("./.lighthouseci/reports/manifest.json").filter((run) => run.isRepresentativeRun);
            const min = (key) => Math.round(100 * Math.min(...runs.map((run) => run.summary[key])));
            `perf ${min("performance")} · a11y ${min("accessibility")} · bp ${min("best-practices")} · seo ${min("seo")}`
          ')
          node ../.github/scripts/badge.mjs badges/e2e-tests.json "e2e tests" "$passed passed"
          node ../.github/scripts/badge.mjs badges/lighthouse.json "lighthouse" "$scores" "brightgreen"

      - name: Upload badge data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: badges-e2e
          path: frontend/badges/

  # Separate job so that the only code running with write access is the publish script, not the build
  publish-badges:
    name: Publish E2E and Lighthouse badges
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Badges are cosmetic: a failed publication must not turn the run red, which would skip the deploy
    continue-on-error: true
    # One publication per workflow at a time, in push order, so an older run cannot publish last
    concurrency:
      group: badges-${{ github.workflow }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Download badge data
        uses: actions/download-artifact@v4
        with:
          name: badges-e2e
          path: badges

      - name: Publish to the badges branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-badges.sh badges/*.json
