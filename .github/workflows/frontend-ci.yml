name: Frontend CI

on:
  push:
    branches:
      - main
      # Issue branches: <issue-number>-<type>/<short-name>
      - "[0-9]*-*/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      # Fails if coverage falls under the floor set in angular.json (test target)
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          summary=coverage/frontend/coverage-summary.json
          [ -f "$summary" ] || exit 0
          node -e '
            const t = require("./" + process.argv[1]).total;
            const row = (name, key) => `| ${name} | ${t[key].pct.toFixed(1)} % |`;
            console.log(["### Frontend coverage (Vitest, v8)", "", "| Counter | Covered |", "|---------|---------|",
              row("Lines", "lines"), row("Branches", "branches"), row("Functions", "functions"),
              row("Statements", "statements")].join("\n"));
          ' "$summary" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/frontend/
          if-no-files-found: ignore

      # Inputs of the README badges, published by the job below (main only)
      - name: Badge data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p badges
          passed=$(node -p 'require("./coverage/vitest-results.json").numPassedTests')
          lines=$(node -p 'require("./coverage/frontend/coverage-summary.json").total.lines.pct + "%"')
          node ../.github/scripts/badge.mjs badges/frontend-tests.json "frontend tests" "$passed passed"
          node ../.github/scripts/badge.mjs badges/frontend-coverage.json "frontend coverage" "$lines"

      - name: Upload badge data
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: badges-frontend
          path: frontend/badges/

  # Separate job so that the only code running with write access is the publish script, not the build
  publish-badges:
    name: Publish frontend badges
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Badges are cosmetic: a failed publication must not turn the run red, which would skip the deploy
    continue-on-error: true
    permissions:
      contents: write

    steps:
      - name: Checkout scripts
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - name: Download badge data
        uses: actions/download-artifact@v4
        with:
          name: badges-frontend
          path: badges

      - name: Publish to the badges branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-badges.sh badges/*.json
