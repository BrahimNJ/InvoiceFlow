<section class="cta" id="get-started" aria-labelledby="cta-title">
  <div class="container">
    <div class="panel">
      <h2 id="cta-title">Be ready before September 2027</h2>
      <p>Customers, products and invoices in one place, built for the structured invoices France now requires.</p>
      <div class="actions">
        <a class="btn btn-light" routerLink="/register">Create your account <app-icon name="arrow-right" [size]="18" /></a>
        <a class="btn btn-outline-light" [href]="repositoryUrl" target="_blank" rel="noopener">
          <app-icon name="github" [size]="18" /> View the source
        </a>
      </div>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container bar">
    <div class="brand">
      <app-logo />
      <p>Modern invoicing for French businesses.</p>
    </div>
    <app-api-status-pill />
    <p class="legal">© {{ year }} InvoiceFlow · Angular &amp; Spring Boot</p>
  </div>
</footer>
