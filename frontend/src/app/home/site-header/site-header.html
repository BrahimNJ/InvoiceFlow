<header class="header">
  <div class="container bar">
    <a href="#top" aria-label="InvoiceFlow, back to top"><app-logo /></a>

    <nav aria-label="Main">
      <ul>
        @for (link of links; track link.href) {
          <li><a [href]="link.href">{{ link.label }}</a></li>
        }
      </ul>
    </nav>

    <div class="actions">
      <app-theme-toggle />
      @if (isAuthenticated()) {
        <a class="btn btn-primary btn-sm" routerLink="/dashboard">Open dashboard</a>
      } @else {
        <a class="btn btn-ghost btn-sm" routerLink="/login">Sign in</a>
        <a class="btn btn-primary btn-sm" routerLink="/register">Get started</a>
      }
    </div>
  </div>
</header>
