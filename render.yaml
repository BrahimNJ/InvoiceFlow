# Render Blueprint for the backend (https://render.com/docs/blueprint-spec).
# Deploys are triggered by .github/workflows/deploy-backend.yml once Backend CI is green.
services:
  - type: web
    name: invoiceflow-backend
    runtime: docker
    plan: free
    region: frankfurt
    # Paths are relative to the repository root. Do not add rootDir: Render would prefix
    # it to dockerContext (backend/backend). Auto-deploy is off, so build filters are not needed.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeployTrigger: "off"
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Neon credentials, entered in the Render dashboard (never committed)
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
